spring.application.name=spacebus-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never

server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

spring.liquibase.change-log=classpath:db/changelog-master.xml
spring.liquibase.default-schema=public


# Nome exibido ao passageiro enquanto o piloto tem uma única transportadora.
spacebus.transportadora.nome=${SPACEBUS_TRANSPORTADORA:Transportadora piloto}

# Reserva e pagamento (premissas do piloto em docs/modulo-03-reserva-pagamento.md).
spacebus.reserva.bloqueio-minutos=${SPACEBUS_RESERVA_BLOQUEIO_MINUTOS:10}
spacebus.reserva.cancelamento-horas=${SPACEBUS_RESERVA_CANCELAMENTO_HORAS:2}
# Sem padrão aqui: fora de dev/docker o backend não sobe sem provedor real configurado e segredo definido.
spacebus.pagamento.provedor=${SPACEBUS_PAGAMENTO_PROVEDOR:}
spacebus.pagamento.webhook-segredo=${SPACEBUS_WEBHOOK_SEGREDO}
# Toda chamada ao provedor tem tempo limite; reembolso que falha é tentado de novo a cada 5 min, até o máximo.
spacebus.pagamento.timeout-ms=${SPACEBUS_PAGAMENTO_TIMEOUT_MS:5000}
spacebus.reembolso.max-tentativas=${SPACEBUS_REEMBOLSO_MAX_TENTATIVAS:12}

# Changesets de demonstração (context:dev) só rodam nos perfis dev e docker.
spring.liquibase.contexts=${SPACEBUS_LIQUIBASE_CONTEXTS:producao}

# Localização da viagem (premissas do piloto em docs/modulo-04-localizacao.md; mesmos valores em
# frontend/src/features/localizacao/limites.ts). Iniciar abre 30 min antes da partida e fecha 2 h depois.
spacebus.localizacao.inicio-antes-min=${SPACEBUS_LOCALIZACAO_INICIO_ANTES_MIN:30}
spacebus.localizacao.inicio-depois-min=${SPACEBUS_LOCALIZACAO_INICIO_DEPOIS_MIN:120}
spacebus.localizacao.encerramento-automatico-horas=${SPACEBUS_LOCALIZACAO_ENCERRAMENTO_AUTOMATICO_HORAS:6}
spacebus.localizacao.retencao-horas=${SPACEBUS_LOCALIZACAO_RETENCAO_HORAS:24}
spacebus.localizacao.desatualizada-segundos=${SPACEBUS_LOCALIZACAO_DESATUALIZADA_SEGUNDOS:120}
spacebus.localizacao.lacuna-segundos=${SPACEBUS_LOCALIZACAO_LACUNA_SEGUNDOS:60}

spring.docker.compose.enabled=false
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:spacebus}
spring.datasource.username=${POSTGRES_USER:spacebus}
spring.datasource.password=${POSTGRES_PASSWORD:spacebus}
spring.liquibase.contexts=dev

# Piloto/local: pagamento simulado e segredo de desenvolvimento do webhook.
spacebus.pagamento.provedor=${SPACEBUS_PAGAMENTO_PROVEDOR:simulado}
spacebus.pagamento.webhook-segredo=${SPACEBUS_WEBHOOK_SEGREDO:segredo-de-desenvolvimento}

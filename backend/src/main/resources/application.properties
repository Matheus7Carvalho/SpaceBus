spring.application.name=spacebus-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never

server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

spring.liquibase.change-log=classpath:db/changelog-master.xml
spring.liquibase.default-schema=public


# Nome exibido ao passageiro enquanto o piloto tem uma única transportadora.
spacebus.transportadora.nome=${SPACEBUS_TRANSPORTADORA:Transportadora piloto}

# Reserva e pagamento (premissas do piloto em docs/modulo-03-reserva-pagamento.md).
spacebus.reserva.bloqueio-minutos=${SPACEBUS_RESERVA_BLOQUEIO_MINUTOS:10}
spacebus.reserva.cancelamento-horas=${SPACEBUS_RESERVA_CANCELAMENTO_HORAS:2}
# Sem padrão aqui: fora de dev/docker o backend não sobe sem provedor real configurado e segredo definido.
spacebus.pagamento.provedor=${SPACEBUS_PAGAMENTO_PROVEDOR:}
spacebus.pagamento.webhook-segredo=${SPACEBUS_WEBHOOK_SEGREDO}

# Changesets de demonstração (context:dev) só rodam nos perfis dev e docker.
spring.liquibase.contexts=${SPACEBUS_LIQUIBASE_CONTEXTS:producao}

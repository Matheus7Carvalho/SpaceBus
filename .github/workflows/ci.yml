# Verificação automática: roda em todo PR para a main e em todo push na main.
# Os três jobs rodam em paralelo; a regra de proteção da main exige os três verdes.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Inclui os testes de integração com PostgreSQL real (Testcontainers usa o Docker da máquina).
      - name: Testes
        run: ./mvnw -B test

      - name: Relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (tipos, lint e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos e build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Mesmo fuso da operação: os specs calculam "hoje" e "amanhã" com o relógio local.
      TZ: America/Araguaina
      # Endpoints de apoio ao E2E (/api/dev/**): no container só existem com o perfil e2e.
      BACKEND_PERFIS: docker,e2e
      E2E_BASE_URL: http://localhost:5173
      # O backend no container leva mais que o dev local para responder na primeira vez.
      E2E_SAUDE_PRAZO_MS: '180000'
    steps:
      - uses: actions/checkout@v4

      - name: Subir a stack (banco, backend com a seed e nginx)
        run: docker compose --profile app up -d --build

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências e navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E (desktop e mobile)
        working-directory: frontend
        run: npx playwright test

      - name: Logs dos containers
        if: failure()
        run: docker compose --profile app logs --no-color > compose.log

      - name: Relatório do Playwright e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            compose.log
          retention-days: 7

      - name: Derrubar a stack
        if: always()
        run: docker compose --profile app down -v
